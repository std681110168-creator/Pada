<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บรูปภาพสวยๆ</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #f8f4ff 0%, #eef5ff 35%, #ffffff 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #22243d;
    }
    .card {
      width: min(96vw, 840px);
      border-radius: 36px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(250,250,255,0.95) 100%);
      box-shadow: 0 36px 90px rgba(30, 60, 120, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(18px);
    }
    .hero {
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(111, 102, 240, 0.25), transparent 38%);
      pointer-events: none;
    }
    .hero img {
      width: 100%;
      display: block;
      object-fit: cover;
      min-height: 460px;
      filter: saturate(0.98) contrast(1.03);
    }
    .label {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(17, 31, 99, 0.88);
      color: white;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      box-shadow: 0 14px 30px rgba(17, 31, 99, 0.2);
      backdrop-filter: blur(12px);
    }
    .content {
      padding: 38px 34px 28px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .content h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }
    .content p {
      margin: 22px auto 0;
      max-width: 700px;
      font-size: 1rem;
      line-height: 1.8;
      color: #4c5162;
    }
    .content .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding: 14px 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6f66f0, #5c9cff);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .content .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(92, 156, 255, 0.32);
    }
    .footer {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 28px 34px 36px;
      border-top: 1px solid rgba(82, 96, 155, 0.08);
      background: rgba(250, 250, 255, 0.9);
    }
    .author {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .author-avatar {
      width: 66px;
      height: 66px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(92, 156, 255, 0.18);
    }
    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .author-info {
      text-align: left;
    }
    .author-info strong {
      display: block;
      font-size: 1rem;
      color: #1c232f;
    }
    .author-info span {
      color: #5d6382;
      font-size: 0.95rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(111, 102, 240, 0.18), rgba(92, 156, 255, 0.18));
      color: #2a3251;
      font-weight: 700;
      font-size: 0.95rem;
      justify-self: end;
    }
    .badge::before {
      content: "✦";
      color: #6f66f0;
    }
    @media (max-width: 640px) {
      .footer {
        grid-template-columns: 1fr;
        padding: 24px 24px 30px;
      }
      .badge {
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <article class="card">
    <section class="hero">
      <span class="label">ภาพสวยงาม</span>
      <img src="xxx.png" alt="วิวธรรมชาติ">
    </section>
    <section class="content">
      <a class="button" href="#">ดูภาพเพิ่มเติม</a>
    </section>
    <section class="footer">
      <div class="author">
        <div class="author-avatar">
          <img src="xxx.png" alt="ผู้จัดทำ">
        </div>
        <div class="author-info">
          <strong>ชื่อผู้จัดทำ: ภาดา ชูเนตร</strong>
          <span>ระดับ ปวช 2/10 • เลขที่ 13</span>
          <span>นักออกแบบเว็บไซต์ & ผู้พัฒนาเว็บ</span>
        </div>
      </div>
      <div class="badge">สร้างโดยทีมงาน</div>
    </section>
  </article>
</body>
</html>
