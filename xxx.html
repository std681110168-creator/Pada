<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ภาพสวยๆ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #f0e8ff 0%, #d9e8ff 40%, #f9fafc 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }
    .photo-card {
      width: min(92vw, 720px);
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(24, 48, 99, 0.18);
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.65);
    }
    .photo-card img {
      width: 100%;
      display: block;
      height: auto;
      object-fit: cover;
    }
    .caption {
      padding: 28px;
      text-align: center;
    }
    .caption h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: -0.05em;
    }
    .caption p {
      margin: 14px auto 0;
      max-width: 620px;
      font-size: 1rem;
      line-height: 1.75;
      color: #4a4a4a;
    }
    .ribbon {
      position: absolute;
      top: 18px;
      right: 18px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #b56bff, #6d92ff);
      color: white;
      border-radius: 999px;
      font-size: 0.95rem;
      box-shadow: 0 14px 30px rgba(38, 55, 118, 0.16);
    }
    .card-wrapper {
      position: relative;
      padding: 24px;
    }
  </style>
</head>
<body>
  <section class="photo-card">
    <div class="card-wrapper">
      <div class="ribbon">ภาพเด็ด</div>
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" alt="วิวสวยๆ">
    </div>
    <div class="caption">
      <h1>ความงดงามของธรรมชาติ</h1>
      <p>ภาพนี้แสดงถึงบรรยากาศที่สงบและเป็นธรรมชาติ พร้อมด้วยแสงอาทิตย์อ่อนๆ ที่ส่องลงบนภูเขาและทะเลหมอก เหมาะสำหรับหน้าบ้านเว็บไซต์หรือโปรไฟล์สวยๆ ของคุณ</p>
    </div>
  </section>
</body>
</html>
